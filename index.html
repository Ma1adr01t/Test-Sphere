<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Motion Ball Endless Tilt Demo</title>
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <h1>Motion Ball Tilt Demo</h1>

    <p>
      Hold your iPhone in a comfortable position, then tap Start / Calibrate.
      That position becomes neutral.
    </p>

    <div class="button-row">
      <button id="startButton">Start / Calibrate</button>
      <button id="resetButton">Reset</button>
    </div>

    <p id="status">Waiting to start.</p>
    <p id="distance">Distance: 0</p>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
